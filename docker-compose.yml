services:
  postgres:
    image: postgres:16
    container_name: delivra-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-delivra}
      POSTGRES_USER: ${USER_DB_USER:-delivra_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-delivra_password}
    ports:
      - "${DELIVRA_DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - delivra-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DELIVRA_DB_USER:-delivra_user} -d ${DELIVRA_DB_NAME:-delivra_user_service}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: delivra-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - delivra-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pg-data:
  redis-data:

networks:
  delivra-network:
    driver: bridge
